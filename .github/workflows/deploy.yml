name: Deploy to Cloud Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 支持手动触发

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: aiot_edge/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd aiot_edge/backend
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd aiot_edge/backend
          python -m pytest tests/ -q || echo "::warning::无测试或测试未通过，继续部署"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: aiot_edge/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd aiot_edge/frontend
          npm ci --no-audit --no-fund

      - name: Build frontend
        run: |
          cd aiot_edge/frontend
          npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: aiot_edge/frontend/dist

  deploy:
    name: 部署到云服务器
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: aiot_edge/frontend/dist

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/aiot' }}"
            mkdir -p "$DEPLOY_PATH"

            # 1. 同步后端代码（rsync 或 git pull）
            cd "$DEPLOY_PATH/me" || git clone https://github.com/${{ github.repository }}.git "$DEPLOY_PATH/me"
            cd "$DEPLOY_PATH/me"
            git fetch origin main
            git reset --hard origin/main

            # 2. 重新构建前端（产物已由 CI 构建，此处可直接用服务器构建保证一致）
            cd aiot_edge/frontend
            npm ci --no-audit --no-fund
            npm run build

            # 3. 执行部署脚本（安装后端依赖 + systemd + nginx）
            cd "$DEPLOY_PATH/me"
            sudo bash deploy/deploy.sh --deploy-path "$DEPLOY_PATH"

            # 4. 健康检查
            sleep 3
            curl -fsS http://localhost:${{ secrets.BACKEND_PORT || '8000' }}/api/health || exit 1
